<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in &middot; Glicc</title>
<script src="https://cdn.tailwindcss.com/3.4.13"></script>
<style>body{background:#ffffff}</style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex items-center justify-center">
<div class="w-full max-w-sm px-4">
  <div class="rounded-lg border border-slate-200 shadow-sm p-6">
    <h1 class="text-lg font-semibold tracking-tight">Glicc model switch</h1>
    <p class="text-sm text-slate-500 mt-1">Sign in to continue</p>

    <form id="login-form" class="mt-5 space-y-3">
      <div>
        <label class="text-xs font-medium text-slate-600">Username</label>
        <input id="u" name="username" type="text" autocomplete="username" required
          class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-slate-400">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600">Password</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required
          class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 text-sm
                 focus:outline-none focus:ring-2 focus:ring-slate-400">
      </div>
      <p id="error" class="text-xs text-red-600 hidden"></p>
      <button type="submit" id="submit-btn"
        class="w-full rounded-md bg-slate-900 text-white text-sm font-medium py-2
               hover:bg-slate-800 transition">
        Sign in
      </button>
    </form>
  </div>
  <p class="text-xs text-slate-400 mt-4 text-center">llminferences.glicc.id</p>
</div>

<script>
const form = document.getElementById("login-form");
const err = document.getElementById("error");
const btn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.classList.add("hidden");
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("u").value,
        password: document.getElementById("p").value,
      }),
    });
    const body = await r.json();
    if (r.ok) {
      window.location.href = "/";
      return;
    }
    err.textContent = body.error || "Sign in failed.";
    err.classList.remove("hidden");
  } catch (e) {
    err.textContent = "Network error. Try again.";
    err.classList.remove("hidden");
  }
  btn.disabled = false;
  btn.textContent = "Sign in";
});
</script>
</body>
</html>
