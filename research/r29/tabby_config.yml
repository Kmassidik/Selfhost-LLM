# R29 - TabbyAPI (exllamav3) config for OrcaSAQ-2-27B as the glicc endpoint.
# Copied to engines/tabbyapi/config.yml by swap_to_orca.sh; MAXLEN / CACHE / DRAFT are
# substituted there. Same port, key and model id as the Bonsai endpoint, so clients
# (OpenCode via https://llm.glicc.id/v1) need no change.
network:
  host: 127.0.0.1          # the Cloudflare tunnel is the only way in
  port: 8081
  disable_auth: false      # key comes from engines/tabbyapi/api_tokens.yml (git-ignored)
  send_tracebacks: false

logging:
  log_prompt: false
  log_requests: false
  log_generation_params: false

model:
  model_dir: /root/Desktop/selfhostllm/models/hf
  inline_model_loading: false
  model_name: glicc-model-testing   # symlink -> OrcaSAQ-2-27B
  max_seq_len: __MAXLEN__
  cache_size: __MAXLEN__
  cache_mode: __CACHE__
  tensor_parallel: false           # PCIe, no peer access: split by layer across cards 1+2
  gpu_split_auto: true
  autosplit_reserve: [96]
  chunk_size: 2048
  max_batch_size: 4                # 4 concurrent requests, like the llama.cpp endpoint
  reasoning: true                  # <think> block returned separately from content
  tool_format: qwen3_5             # Qwen3.5/3.8 XML tool calls (alias of qwen3_coder)

draft_model:
  draft_mode: __DRAFT__            # disabled | mtp | ngram (R29 measures all three)
